[project]
name = "treeclip"
version = "0.1.0"
description = "Multimodal foundation-model fusion for tree species discrimination on NEON/IDTReeS"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "torch>=2.2",
    "torchvision>=0.17",
    "geopandas>=0.14",
    "rasterio>=1.3",
    "laspy[lazrs]>=2.5",
    "shapely>=2.0",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "scikit-learn>=1.4",
    "pillow>=10.0",
    "open-clip-torch>=2.24",
    "timm>=1.0",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
